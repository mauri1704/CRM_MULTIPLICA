name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
          POSTGRES_DB: crm
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U crm" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://crm:crm@localhost:5432/crm
      APP_DATABASE_URL: postgresql://crm_app:crm_app@localhost:5432/crm
      APP_DB_PASSWORD: crm_app
      TEST_DATABASE_URL: postgresql://crm:crm@localhost:5432/crm_test
      TEST_APP_DATABASE_URL: postgresql://crm_app:crm_app@localhost:5432/crm_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F @crm/shared build
      - name: Formato
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Tipos
        run: pnpm typecheck
      - name: Pruebas unitarias
        run: pnpm test
      - name: Preparar bases de datos
        run: |
          PGPASSWORD=crm psql -h localhost -U crm -d crm -c 'CREATE DATABASE crm_test'
          pnpm db:setup
          pnpm db:deploy
      - name: Pruebas de integración (API + PostgreSQL + RLS)
        run: pnpm test:integration
      - name: Build
        run: pnpm build
      - name: E2E (Playwright)
        env:
          NODE_ENV: development
        run: |
          pnpm db:seed
          pnpm -F @crm/web exec playwright install --with-deps chromium
          pnpm -F @crm/web test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
